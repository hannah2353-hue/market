const { useState, useEffect, useMemo } = React;

// ============ Encrypted data (AES-GCM + PBKDF2) ============
const ENCRYPTED = JSON.parse(document.getElementById('encrypted-blob').textContent);
let analyzed = null, competitor = null, ideasData = null, signalFeed = [];

function b64ToBytes(b64) {
  const bin = atob(b64);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}

async function decryptData(password) {
  const salt = b64ToBytes(ENCRYPTED.salt);
  const iv = b64ToBytes(ENCRYPTED.iv);
  const ciphertext = b64ToBytes(ENCRYPTED.ciphertext);
  const passwordKey = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(password),
    { name: "PBKDF2" }, false, ["deriveKey"]
  );
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: ENCRYPTED.iterations, hash: "SHA-256" },
    passwordKey,
    { name: "AES-GCM", length: 256 },
    false, ["decrypt"]
  );
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
  const obj = JSON.parse(new TextDecoder().decode(plain));
  analyzed = obj.analyzed;
  signalFeed = (analyzed && Array.isArray(analyzed.signals) && analyzed.signals.length)
    ? analyzed.signals.map((s) => ({
        id: (s.date||'') + '|' + (s.title||''),
        original: { date:s.date, source:s.source, company:s.company, service:'', category:s.category, title:s.title, url:(s.url||''), content:s.summary },
        analysis: { summary:s.summary, importance_score:s.importance_score, keywords:Array.isArray(s.tags)?s.tags:[] }
      }))
    : (analyzed ? (analyzed.data||[]) : []);
  competitor = obj.competitor;
  ideasData = obj.ideas;
  return true;
}

const STAGES = ["유입","전환","심사","실행","리텐션"];
const ideaDate = (it) => it.created_at || (ideasData.timestamp || '').slice(0,10);

const CATEGORY_COLOR = {

// 자사·너무 흔해서 변별력 없는 토큰 (매칭 점수에서 제외)
const SELF_BRANDS = ['ok', '오케이', 'okx'];
const STOP_TOKENS = new Set([
  '저축은행', '은행', '금융', '디지털', '앱', '서비스', '출시', '대출', '제휴',
  '고객', '핀테크', '플랫폼', '금리', '상품', '혜택', '이벤트', '예금', '적금', '계좌'
]);
const MATCH_THRESHOLD = 6; // 이 점수 이상이어야 "연관"으로 인정 (경쟁사 브랜드+키워드 또는 키워드 3개)

// 기사 → 아이디어 연관도 점수 (경쟁사 브랜드 + 변별력 있는 키워드 중심)
function ideaMatchScore(idea, signal) {
  if (!signal) return 0;
  const ts = idea.target_customer || {};
  const ps = idea.partnership_structure || {};
  const hay = [
    idea.service_name, idea.problem_definition, idea.solution_approach,
    idea.revenue_model, idea.mvp_scope, idea.based_on_insight, idea.gap,
    ts.primary, ts.secondary, ps.자사, ps.파트너
  ].filter(Boolean).join(' ').toLowerCase();
  let score = 0;
  const o = signal.original || {};
  // 1) 경쟁사 브랜드 매칭 (가장 강력) — 자사(OK)는 제외
  const co = String(o.company || '').toLowerCase().replace(/저축은행|은행|주식회사|㈜/g, '').trim();
  if (co.length >= 2 && !SELF_BRANDS.includes(co) && hay.includes(co)) score += 4;
  // 2) 변별력 있는 키워드/태그만 (흔한 금융 용어 제외)
  let kwHits = 0;
  ((signal.analysis && signal.analysis.keywords) || []).forEach(k => {
    const kw = String(k).toLowerCase().trim();
    if (kw.length >= 2 && !STOP_TOKENS.has(kw) && !SELF_BRANDS.includes(kw) && hay.includes(kw)) kwHits++;
  });
  score += Math.min(kwHits, 3) * 2; // 키워드는 최대 3개까지만 반영
  // 3) 구 원천코드(r001 등) 레거시 연결 보너스
  if (idea.based_on_insight && signal.id &&
      idea.based_on_insight.toLowerCase().includes(String(signal.id).toLowerCase())) score += 6;
  return score;
}

function NewIdeaPicker({ open, signal, onClose, onPick }) {
  const [showAll, setShowAll] = useState(false);
  useEffect(() => { setShowAll(false); }, [signal, open]); // 기사 바뀌면 다시 '연관만' 보기로
  if (!open) return null;
  let related = [];
  if (signal) {
    related = ideasData.ideas
      .map(i => ({ i, s: ideaMatchScore(i, signal) }))
      .filter(x => x.s >= MATCH_THRESHOLD)
      .sort((a, b) => b.s - a.s)
      .slice(0, 3)          // 관련된 것만, 최대 3개
      .map(x => x.i);
  }
  const matched = related.length > 0;
  const pool = showAll ? [...ideasData.ideas] : related;
  return (
    <div onClick={onClose} className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
      <div onClick={e => e.stopPropagation()}
        className="bg-white rounded-2xl max-w-lg w-full shadow-2xl">

          <button onClick={onClose} className="p-1 text-slate-500 hover:text-slate-900">✕</button>
        </div>
        <div className="p-5">
          <p className="text-sm text-slate-600 mb-4">
            {!signal
              ? '전체 아이디어 풀에서 선택하세요'
              : showAll
                ? <>전체 아이디어 {pool.length}건</>
                : matched
                  ? <><b className="text-slate-900">{signal.original.title}</b> 와(과) 연관된 아이디어 {pool.length}건</>
                  : <><b className="text-slate-900">{signal.original.title}</b> 와(과) 직접 연관된 아이디어가 없습니다</>}
          </p>
          {(!signal || showAll || matched) ? (
            <div className="space-y-2 max-h-[50vh] overflow-y-auto scroll-thin">
              {pool.map(idea => (
                <button key={idea.idea_id} onClick={() => onPick(idea)}
                  className="w-full text-left p-3 border border-slate-200 rounded-lg hover:border-orange-300 hover:bg-orange-50/40 transition-colors">
                  <div className="flex items-center gap-2 mb-1 flex-wrap">
                    <span className="text-xs font-mono text-slate-400">{idea.idea_id.toUpperCase()}</span>
                    <Tag className={GAP_COLOR[idea.gap] || 'bg-slate-100 text-slate-700'}>{idea.gap}</Tag>

                  </div>
                  <div className="text-sm font-bold text-slate-900">{idea.service_name}</div>
                  <div className="text-xs text-slate-500 line-clamp-1 mt-0.5">{idea.problem_definition}</div>
                </button>
              ))}
            </div>
          ) : (
            <div className="text-center py-6 px-3 bg-slate-50 rounded-lg">
              <div className="text-sm text-slate-500">이 기사와 직접 맞물리는 저장된 아이디어가 없어요.</div>
              <div className="text-xs text-slate-400 mt-1">전체 아이디어에서 참고할 만한 걸 둘러볼 수 있어요.</div>
            </div>
          )}
          {signal && !showAll && (
            <button onClick={() => setShowAll(true)}
              className="mt-3 w-full py-2 text-xs font-semibold text-slate-600 border border-slate-200 rounded-lg hover:bg-slate-50 transition-colors">
              전체 아이디어 둘러보기 ({ideasData.ideas.length}건)
            </button>
          )}
          {signal && showAll && matched && (
            <button onClick={() => setShowAll(false)}
              className="mt-3 w-full py-2 text-xs font-semibold text-orange-600 border border-orange-200 rounded-lg hover:bg-orange-50 transition-colors">
              ← 이 기사 연관 아이디어만 보기
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

const PAGE_TITLE = {
  dashboard: '대시보드',
  signals:   '시장 시그널',
  compet:    '경쟁사 분석',
  ideas:     '아이디어',
  saved:     '관심 목록',
  settings:  '설정',
};

function PageSignals({ onGenerate }) {
  const [search, setSearch] = useState('');
  const [category, setCategory] = useState(null);
  const [importance, setImportance] = useState(null);
  const [expanded, setExpanded] = useState(null);
  const sorted = [...signalFeed].sort((a,b)=>b.analysis.importance_score - a.analysis.importance_score);
  const categories = [...new Set(signalFeed.map(x => x.original.category))];
  const filtered = sorted.filter(it => {
    if (category && it.original.category !== category) return false;
    if (importance === 'high' && it.analysis.importance_score < 5) return false;
    if (importance === 'mid' && it.analysis.importance_score !== 4) return false;
    if (importance === 'low' && it.analysis.importance_score >= 4) return false;
    if (search && !`${it.original.title} ${it.analysis.summary}`.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });
  return (
    <div className="space-y-4">
      <div className="bg-white border border-slate-200 rounded-xl p-4">
        <div className="flex flex-wrap items-center gap-2">
          <input value={search} onChange={e => setSearch(e.target.value)}
            placeholder="🔎  제목·요약 검색..."
            className="flex-1 min-w-[200px] px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-slate-400" />
          <div className="flex flex-wrap gap-1">
            <button onClick={() => setCategory(null)}
              className={`px-2.5 py-1 text-xs rounded-full transition-colors ${!category ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}`}>전체</button>
            {categories.map(c => (
              <button key={c} onClick={() => setCategory(category === c ? null : c)}
                className={`px-2.5 py-1 text-xs rounded-full transition-colors ${category === c ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}`}>{c}</button>
            ))}
          </div>
          <div className="flex gap-1 ml-auto">
            {[['all','전체',null],['high','높음','high'],['mid','중간','mid'],['low','낮음','low']].map(([id,label,val]) => (
              <button key={id} onClick={() => setImportance(val)}
                className={`px-2.5 py-1 text-xs rounded-full transition-colors ${importance === val ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}`}>{label}</button>
            ))}
          </div>
        </div>
      </div>
      <div className="bg-white border border-slate-200 rounded-xl overflow-hidden">
        <div className="px-5 py-3 border-b border-slate-100 text-xs text-slate-500 flex justify-between">
          <span>총 <b className="text-slate-900 tabular-nums">{filtered.length}</b>건</span>
        </div>
        <table className="w-full text-sm">
          <thead>
            <tr className="text-xs text-slate-500 font-medium border-b border-slate-100">
              <th className="text-left px-5 py-2.5 whitespace-nowrap">날짜</th>
              <th className="text-left px-3 py-2.5">제목</th>
              <th className="text-left px-3 py-2.5 whitespace-nowrap">원문</th>
              <th className="text-left px-3 py-2.5 whitespace-nowrap">카테고리</th>
              <th className="text-left px-3 py-2.5 whitespace-nowrap">중요도</th>
              <th className="text-left px-3 py-2.5 whitespace-nowrap">출처</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(it => {
              const imp = importanceOf(it.analysis.importance_score);
              const open = expanded === it.id;
              return (
                <React.Fragment key={it.id}>
                <tr onClick={() => setExpanded(open ? null : it.id)}
                  className={`cursor-pointer hover:bg-slate-50 transition-colors border-b border-slate-50 last:border-0 ${open ? 'bg-slate-50' : ''}`}>
                  <td className="px-5 py-3 text-slate-600 tabular-nums whitespace-nowrap align-top">{it.original.date}</td>
                  <td className={`px-3 py-3 text-slate-900 font-medium min-w-[260px] ${open ? '' : 'line-clamp-1'}`}>
                    <span className={`inline-block mr-1.5 text-slate-400 transition-transform ${open ? 'rotate-90' : ''}`}>▸</span>
                    {it.original.title || '(제목 없음)'}
                  </td>
                  <td className="px-3 py-3 whitespace-nowrap align-top">
                    {it.original.url ? (
                      <a href={it.original.url} target="_blank" rel="noopener" onClick={e => e.stopPropagation()}
                         className="text-xs text-orange-600 hover:text-orange-700 font-medium whitespace-nowrap">원문 →</a>
                    ) : <span className="text-xs text-slate-300">—</span>}
                  </td>
                  <td className="px-3 py-3 whitespace-nowrap align-top"><Tag className={catColor(it.original.category)}>{it.original.category}</Tag></td>
                  <td className="px-5 py-3 whitespace-nowrap align-top"><Tag className={imp.color}>{imp.label}</Tag></td>
                  <td className="px-3 py-3 text-slate-700 whitespace-nowrap align-top">{it.original.source}</td>
                </tr>
                {open && (
                  <tr className="bg-slate-50/60 border-b border-slate-100">
                    <td colSpan="6" className="px-5 pb-4 pt-0">
                      <div className="text-sm text-slate-700 leading-relaxed mb-3">{it.analysis.summary || '(요약 없음)'}</div>
                      {Array.isArray(it.analysis.keywords) && it.analysis.keywords.length > 0 && (
                        <div className="flex flex-wrap gap-1 mb-3">
                          {it.analysis.keywords.map((k, ki) => <Tag key={ki} className="bg-slate-100 text-slate-600">{k}</Tag>)}
                        </div>
                      )}
                      <div className="flex flex-wrap items-center gap-3">
                        <button onClick={e => { e.stopPropagation(); onGenerate(it); }}
                          className="inline-flex items-center gap-1.5 px-3 py-2 bg-orange-500 text-white text-xs font-semibold rounded-lg hover:bg-orange-600 transition-colors">
                          <Icon name="bulb" className="w-4 h-4" />
                          이 기사로 아이디어 탐색 →
                        </button>
                        {it.original.url && (
                          <a href={it.original.url} target="_blank" rel="noopener" onClick={e => e.stopPropagation()}
                             className="inline-flex items-center gap-1 text-xs font-semibold text-orange-600 hover:text-orange-700">🔗 원문 기사 열기 →</a>
                        )}
                      </div>
                    </td>
                  </tr>
                )}
                </React.Fragment>
              );
            })}
            {filtered.length === 0 && <tr><td colSpan="6" className="text-center text-sm text-slate-500 py-12">조건에 맞는 시그널이 없습니다</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

const THREAT_STYLE = {
  high: { pill:"bg-rose-50 text-rose-700",     dot:"bg-rose-500",     label:"위협 높음" },
  mid:  { pill:"bg-amber-50 text-amber-700",   dot:"bg-amber-500",    label:"위협 중간" },
  low:  { pill:"bg-emerald-50 text-emerald-700", dot:"bg-emerald-500", label:"위협 낮음" },
  self: { pill:"bg-orange-50 text-orange-700", dot:"bg-orange-500",   label:"자사" },
};

// 지표 → 0~100 바 길이 변환
const pctAsset  = (v, max = 17)  => v == null ? 0 : Math.min(100, (v / max) * 100);
const pctRating = (v)            => v == null ? 0 : (v / 5) * 100;
const pctHealth = (delinq)       => delinq == null ? 0 : Math.max(6, Math.min(100, 100 - delinq * 8));

// 건전성(연체율) 색상 — 낮을수록 좋음
const healthColor = (d) => d == null ? 'bg-slate-300' : d < 5 ? 'bg-emerald-500' : d < 8 ? 'bg-amber-500' : 'bg-rose-500';
const ratingColor = (r) => r == null ? 'bg-slate-300' : r >= 4 ? 'bg-emerald-500' : r >= 3 ? 'bg-amber-500' : 'bg-rose-500';

function MetricBar({ label, valueText, pct, color }) {
  return (
    <div className="flex items-center gap-2">
      <div className="w-14 flex-shrink-0 text-[10px] font-semibold text-slate-500">{label}</div>
      <div className="flex-1 h-1.5 bg-slate-100 rounded-full overflow-hidden">
        <div className={`h-full ${color} rounded-full transition-all`} style={{ width: `${pct}%` }} />
      </div>
      <div className="w-14 flex-shrink-0 text-[11px] font-bold text-slate-800 tabular-nums text-right">{valueText}</div>
    </div>
  );
}

function CompanyCard({ company, onSelectSignal }) {
  const t = THREAT_STYLE[company.threat_level] || THREAT_STYLE.low;
  const isSelf = company.is_self;
  return (
    <div className={`bg-white border rounded-xl p-5 ${isSelf ? 'border-orange-400 ring-2 ring-orange-100' : 'border-slate-200'}`}>
      <div className="flex items-start justify-between gap-2 mb-3">
        <div className="flex items-center gap-2 min-w-0">
          <span className="text-xs font-mono font-bold text-slate-400">#{company.rank}</span>
          <h3 className="text-base font-bold text-slate-900 truncate">{company.name}</h3>
          {isSelf && <span className="text-[10px] font-bold px-1.5 py-0.5 bg-orange-500 text-white rounded">자사</span>}
        </div>

          <span className={`w-1.5 h-1.5 rounded-full ${t.dot} mr-1`} />

        <div className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">집중 단계</div>
        <div className="flex flex-wrap gap-1.5">
          {company.focus_stages.map(s => {
            const sty = STAGE_STYLE[s];
            return (
              <span key={s} className={`inline-flex items-center gap-1 px-2 py-0.5 text-xs font-medium rounded-md bg-slate-100 ${sty ? sty.text : 'text-slate-700'}`}>
                {sty && <span>{sty.icon}</span>}
                {s}
              </span>
            );
          })}
        </div>
      </div>

      <div className="mb-3">
        <div className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">핵심 전략</div>
        <p className="text-sm text-slate-800 leading-relaxed">{company.strategy}</p>
      </div>

      {company.metrics && (
        <div className="mb-3 p-3 bg-slate-50 rounded-lg space-y-1.5">
          <div className="flex items-center justify-between mb-1">
            <div className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">📊 핵심 지표</div>
            <span className="text-[9px] text-slate-400 tabular-nums">{company.metrics.as_of} 기준</span>

          <MetricBar
            label="자산규모"
            valueText={company.metrics.total_assets_trillion != null ? `${company.metrics.total_assets_trillion}조` : '—'}

            color={isSelf ? 'bg-orange-500' : 'bg-slate-700'} />
          <MetricBar
            label="앱 평점"
            valueText={company.metrics.app_rating != null ? `${company.metrics.app_rating}★` : '—'}

          <MetricBar
            label="건전성"
            valueText={company.metrics.delinquency_rate != null ? `연체 ${company.metrics.delinquency_rate}%` : '—'}
            pct={pctHealth(company.metrics.delinquency_rate)}
            color={healthColor(company.metrics.delinquency_rate)} />
        </div>
      )}

      <div className="mb-3">
        <div className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">주요 서비스 {company.services.length}건</div>

                <span className="text-[10px] text-slate-400 font-mono">{s.stage}</span>

      </div>

      <div className={`pt-3 border-t ${isSelf ? 'border-orange-100' : 'border-slate-100'}`}>
        <div className={`text-[11px] font-bold uppercase tracking-wider mb-1 ${isSelf ? 'text-orange-600' : 'text-slate-500'}`}>
          {isSelf ? '🚀 확장 방향' : '🎯 우리의 대응'}

        <p className={`text-xs leading-relaxed ${isSelf ? 'text-orange-900 font-medium' : 'text-slate-700'}`}>
          {company.our_takeaway}
        </p>
      </div>
    </div>
  );
}

function MarketContextSection({ ctx, onSelectSignal }) {

        {sections.map(sec => {

function PageCompet({ onSelectSignal }) {

function PageIdeas({ onSelect }) {
  const [filter, setFilter] = useState(null);
  const gaps = [...new Set(ideasData.ideas.map(i => i.gap))];
  const sorted = [...ideasData.ideas].sort((a,b) => ideaDate(b).localeCompare(ideaDate(a)) || b.confidence_score - a.confidence_score);
  const filtered = filter ? sorted.filter(i => i.gap === filter) : sorted;
  return (
    <div className="space-y-4">
      <div className="bg-gradient-to-br from-orange-500 to-orange-600 rounded-xl p-5 text-white">
        <div className="text-xs font-semibold uppercase tracking-wider text-white/80 mb-1">🏆 추천 First MVP</div>
        <p className="text-sm leading-relaxed">{ideasData.summary.recommended_first_mvp}</p>
      </div>
      <div className="flex flex-wrap gap-1.5">
        <button onClick={() => setFilter(null)}
          className={`px-3 py-1.5 text-xs rounded-full transition-colors ${!filter ? 'bg-slate-900 text-white' : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'}`}>
          전체 {sorted.length}
        </button>
        {gaps.map(g => {
          const count = sorted.filter(i => i.gap === g).length;
          return (
            <button key={g} onClick={() => setFilter(filter === g ? null : g)}
              className={`px-3 py-1.5 text-xs rounded-full transition-colors ${filter === g ? 'bg-slate-900 text-white' : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'}`}>
              {g} {count}
            </button>
          );
        })}
      </div>
      <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
        {filtered.map(idea => {
          const pct = Math.round(idea.confidence_score*100);
          const confClr = pct >= 80 ? 'bg-emerald-50 text-emerald-700' : pct >= 70 ? 'bg-amber-50 text-amber-700' : 'bg-slate-100 text-slate-600';
          return (
            <button key={idea.idea_id} onClick={() => onSelect(idea)}
              className="text-left bg-white border border-slate-200 rounded-xl p-4 hover:border-orange-300 hover:shadow-sm transition-all">
              <div className="flex items-center gap-2 mb-2 flex-wrap">
                <span className="text-xs font-mono text-slate-400">{idea.idea_id.toUpperCase()}</span>
                <Tag className={GAP_COLOR[idea.gap] || 'bg-slate-100 text-slate-700'}>{idea.gap}</Tag>
                <Tag className={confClr}>{pct}%</Tag>
                <span className="text-[11px] text-slate-400 ml-auto whitespace-nowrap">{ideaDate(idea)}</span>
              </div>
              <div className="text-sm font-bold text-slate-900 leading-tight mb-2">{idea.service_name}</div>
              <p className="text-xs text-slate-600 line-clamp-3">{idea.problem_definition}</p>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function PageSaved({ savedIds, savedSignals, onSelectIdea, onSelectSignal }) {
  const ideas = ideasData.ideas.filter(i => savedIds.includes(i.idea_id));
  const signals = signalFeed.filter(s => savedSignals.includes(s.id));
  return (
    <div className="space-y-5">
      <div className="bg-white border border-slate-200 rounded-xl p-5">
        <h3 className="text-base font-bold text-slate-900 mb-3">저장한 시그널 <span className="text-sm text-slate-500 font-normal tabular-nums">{signals.length}건</span></h3>
        {signals.length === 0 ? (
          <p className="text-sm text-slate-500 text-center py-6">아직 저장한 시그널이 없습니다. 시그널 상세에서 북마크를 눌러 저장하세요.</p>
        ) : (
          <ul className="divide-y divide-slate-100">
            {signals.map(it => (
              <li key={it.id} onClick={() => onSelectSignal(it)}
                className="py-3 cursor-pointer hover:bg-slate-50 -mx-3 px-3 rounded-lg">
                <div className="flex items-center justify-between mb-1 text-xs text-slate-500">
                  <span className="tabular-nums">{it.original.date} · {it.original.source}</span>
                  <Tag className={importanceOf(it.analysis.importance_score).color}>{importanceOf(it.analysis.importance_score).label}</Tag>
                </div>
                <div className="text-sm font-medium text-slate-900">{it.original.title}</div>
              </li>
            ))}
          </ul>
        )}
      </div>
      <div className="bg-white border border-slate-200 rounded-xl p-5">
        <h3 className="text-base font-bold text-slate-900 mb-3">저장한 아이디어 <span className="text-sm text-slate-500 font-normal tabular-nums">{ideas.length}건</span></h3>
        {ideas.length === 0 ? (
          <p className="text-sm text-slate-500 text-center py-6">아직 저장한 아이디어가 없습니다. 아이디어 상세에서 북마크를 눌러 저장하세요.</p>
        ) : (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
            {ideas.map(idea => (
              <button key={idea.idea_id} onClick={() => onSelectIdea(idea)}
                className="text-left p-4 bg-slate-50 border border-slate-100 rounded-lg hover:bg-white hover:border-orange-300 transition-colors">
                <div className="flex items-center gap-2 mb-2">
                  <Tag className={GAP_COLOR[idea.gap] || 'bg-slate-100 text-slate-700'}>{idea.gap}</Tag>
                  <span className="text-xs font-mono text-slate-400 ml-auto">{idea.idea_id.toUpperCase()}</span>
                </div>
                <div className="text-sm font-bold text-slate-900 leading-tight mb-1">{idea.service_name}</div>
                <p className="text-xs text-slate-600 line-clamp-2">{idea.problem_definition}</p>
              </button>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function PageSettings() {

    <div className="space-y-4 max-w-2xl">
      <div className="bg-white border border-slate-200 rounded-xl p-5">
        <h3 className="text-sm font-bold text-slate-900 mb-3">데이터 업데이트</h3>
        <div className="flex items-center justify-between py-2 border-b border-slate-100">

            <div className="text-xs text-slate-500 mt-0.5">뉴스·공고를 자동 수집하는 시간</div>

            <div className="text-sm font-medium text-slate-900">수집 소스</div>

          <span className="text-sm font-semibold text-slate-900 tabular-nums">{(analyzed.sources_requested || []).length || 4}개</span>

        <h3 className="text-sm font-bold text-slate-900 mb-3">알림</h3>

          <div>
            <div className="text-sm font-medium text-slate-900">중요 시그널 알림</div>

function App() {
  const sorted = useMemo(() => [...signalFeed].sort((a,b)=>b.analysis.importance_score - a.analysis.importance_score), []);
  const [page, setPage] = useState('dashboard');
  const [signal, setSignal] = useState(sorted[0]);
  const [modalIdea, setModalIdea] = useState(null);
  const [pickerOpen, setPickerOpen] = useState(false);
  const [savedIds, setSavedIds] = useState(() => {
    try { return JSON.parse(localStorage.getItem('savedIdeas') || '[]'); } catch { return []; }
  });
  const [savedSignals, setSavedSignals] = useState(() => {
    try { return JSON.parse(localStorage.getItem('savedSignals') || '[]'); } catch { return []; }
  });

  useEffect(() => {
    try { localStorage.setItem('savedIdeas', JSON.stringify(savedIds)); } catch {}
  }, [savedIds]);
  useEffect(() => {
    try { localStorage.setItem('savedSignals', JSON.stringify(savedSignals)); } catch {}
  }, [savedSignals]);

  const kpiTopSignals = sorted.filter(s => s.analysis.importance_score >= 4).length;
  const kpiCompetitors = STAGES.reduce((a,s) => a + (competitor.journey_stages[s]||[]).length, 0);
  const kpiIdeas = ideasData.ideas.length;
  const kpiSaved = savedIds.length + savedSignals.length;

  const toggleSignalSave = () => {
    if (!signal) return;
    setSavedSignals(prev => prev.includes(signal.id) ? prev.filter(x => x !== signal.id) : [...prev, signal.id]);
  };
  const toggleIdeaSave = (ideaId) => {
    setSavedIds(prev => prev.includes(ideaId) ? prev.filter(x => x !== ideaId) : [...prev, ideaId]);
  };

  const handleGenerate = (sig) => {
    setSignal(sig);
    setPickerOpen(true);
  };

  const [allSignalsOpen, setAllSignalsOpen] = useState(false);
  const [allIdeasOpen, setAllIdeasOpen] = useState(false);
  const [journeyDetailOpen, setJourneyDetailOpen] = useState(false);
  const openAllIdeas = () => setAllIdeasOpen(true);

  return (
    <div className="min-h-screen flex bg-slate-50">
      <Sidebar page={page} setPage={setPage} />

      <div className="flex-1 flex flex-col min-w-0">
        <TopBar title={PAGE_TITLE[page] || '대시보드'} onNewIdea={() => setPickerOpen(true)} saved={kpiSaved} />

        <main className="flex-1 overflow-y-auto scroll-thin p-5 sm:p-6">
          {page === 'dashboard' && (
            <div className="space-y-5">
              <div className="grid grid-cols-2 xl:grid-cols-4 gap-4">
                <KpiCard icon="pulse"    iconBg="bg-orange-50"  iconColor="text-orange-600"
                         label="오늘의 핵심 시그널" value={kpiTopSignals} sub="건"
                         deltaValue="2건" deltaLabel="(전일 대비)" />
                <KpiCard icon="building" iconBg="bg-emerald-50" iconColor="text-emerald-600"
                         label="경쟁사 동향" value={kpiCompetitors} sub="건"
                         deltaValue="3건" deltaLabel="(전일 대비)" />
                <KpiCard icon="bulb"     iconBg="bg-amber-50"   iconColor="text-amber-600"
                         label="생성된 아이디어" value={kpiIdeas} sub="개"
                         deltaLabel="최근 7일" />
                <KpiCard icon="star"     iconBg="bg-violet-50"  iconColor="text-violet-600"
                         label="관심 항목" value={kpiSaved} sub="개"
                         deltaLabel="북마크한 항목" />
              </div>
              <div className="grid grid-cols-1 xl:grid-cols-3 gap-5">
                <div className="xl:col-span-2 space-y-5">
                  <SignalsTable items={sorted.slice(0,5)} onSelect={handleGenerate} selectedId={signal?.id} onSeeAll={() => setAllSignalsOpen(true)} />
                  <div className="grid grid-cols-1 md:grid-cols-5 gap-5">
                    <div className="md:col-span-3"><JourneySummary onSeeAll={() => setJourneyDetailOpen(true)} /></div>
                    <div className="md:col-span-2"><KeywordTrends /></div>
                  </div>
                  <RecentIdeas onSelect={setModalIdea} onNew={() => setPickerOpen(true)} onSeeAll={openAllIdeas} />
                </div>
                <div className="space-y-5">
                  <SignalDetail
                    signal={signal}
                    onGenerate={handleGenerate}
                    onSave={toggleSignalSave}
                    isSaved={signal ? savedSignals.includes(signal.id) : false} />
                  <RecommendedIdeas onSelect={setModalIdea} onSeeAll={openAllIdeas} />
                </div>
              </div>
            </div>
          )}

          {page === 'signals' && <PageSignals onGenerate={handleGenerate} />}
          {page === 'compet' && <PageCompet onSelectSignal={(it) => { setSignal(it); setPage('dashboard'); }} />}
          {page === 'ideas' && <PageIdeas onSelect={setModalIdea} />}
          {page === 'saved' && <PageSaved savedIds={savedIds} savedSignals={savedSignals}
                                          onSelectIdea={setModalIdea}
                                          onSelectSignal={(it) => { setSignal(it); setPage('dashboard'); }} />}
          {page === 'settings' && <PageSettings />}
        </main>
      </div>

      <IdeaModal idea={modalIdea} onClose={() => setModalIdea(null)}
        onSave={() => modalIdea && toggleIdeaSave(modalIdea.idea_id)}
        isSaved={modalIdea ? savedIds.includes(modalIdea.idea_id) : false} />
      <NewIdeaPicker open={pickerOpen} signal={signal} onClose={() => setPickerOpen(false)}
        onPick={(idea) => { setPickerOpen(false); setModalIdea(idea); }} />
      <AllSignalsModal open={allSignalsOpen} onClose={() => setAllSignalsOpen(false)}
        onSelect={(it) => { setAllSignalsOpen(false); handleGenerate(it); }} />
      <AllIdeasModal open={allIdeasOpen} onClose={() => setAllIdeasOpen(false)}
        onSelect={(idea) => { setModalIdea(idea); setAllIdeasOpen(false); }} />
      <JourneyDetailModal open={journeyDetailOpen} onClose={() => setJourneyDetailOpen(false)} />
    </div>
  );
}

// ============ LoginGate ============
function LoginGate({ onUnlock }) {
  const [pw, setPw] = useState('');
  const [err, setErr] = useState(null);
  const [loading, setLoading] = useState(false);
  const submit = async (e) => {
    e.preventDefault();
    if (!pw) return;
    setLoading(true); setErr(null);
    try {
      await decryptData(pw);
      try { sessionStorage.setItem('mi_pw', pw); } catch {}
      onUnlock();
    } catch (e2) {
      setErr('비밀번호가 올바르지 않습니다.');
      setLoading(false);
    }
  };
  return (
    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 to-slate-100 p-6">
      <div className="w-full max-w-sm bg-white border border-slate-200 rounded-2xl shadow-lg p-8">
        <div className="flex flex-col items-center mb-6">
          <div className="w-14 h-14 rounded-xl bg-gradient-to-br from-orange-500 to-orange-600 flex items-center justify-center text-white font-bold text-lg tracking-tight mb-3">OK</div>
          <h1 className="text-lg font-extrabold text-slate-900 tracking-tight">시장 동향 리포트</h1>
          <p className="text-xs text-orange-600 font-semibold mt-0.5">OK저축은행 · 내부 전용</p>
        </div>
        <form onSubmit={submit} className="space-y-3">
          <div>
            <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">비밀번호</label>
            <input
              type="password"
              autoFocus
              value={pw}
              onChange={e => setPw(e.target.value)}
              disabled={loading}
              className={`w-full px-4 py-2.5 text-sm border rounded-lg focus:outline-none transition-colors ${
                err ? 'border-rose-300 bg-rose-50' : 'border-slate-300 focus:border-orange-400'
              }`}
              placeholder="Enter password" />
            {err && <div className="mt-1.5 text-xs text-rose-600">⚠ {err}</div>}
          </div>
          <button type="submit" disabled={loading || !pw}
            className="w-full py-2.5 bg-orange-500 text-white text-sm font-semibold rounded-lg hover:bg-orange-600 disabled:bg-slate-200 disabled:text-slate-400 transition-colors">
            {loading ? '확인 중...' : '로그인'}
          </button>
        </form>
        <div className="mt-6 pt-4 border-t border-slate-100 text-[11px] text-slate-500 leading-relaxed">
          <p className="mb-1">📢 <b className="text-slate-700">보안 안내</b></p>
          <p>경쟁사 분석·자사 지표·신규 아이디어가 포함되어 있습니다. 비밀번호를 외부로 공유하지 마세요.</p>
        </div>
      </div>
    </div>
  );
}

function Root() {
  const [unlocked, setUnlocked] = useState(false);
  useEffect(() => {
    // Try auto-unlock from sessionStorage
    let saved = null;
    try { saved = sessionStorage.getItem('mi_pw'); } catch {}
    if (saved) {
      decryptData(saved).then(() => setUnlocked(true)).catch(() => {
        try { sessionStorage.removeItem('mi_pw'); } catch {}
      });
    }
  }, []);
  if (!unlocked) return <LoginGate onUnlock={() => setUnlocked(true)} />;
  return <App/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
